<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifePlan AI - Step2 Preview</title>
  <style>
    :root {
      --blue:#1a56db; --blue-dark:#1240a8; --blue-light:#eef3fd; --blue-bdr:#c2d3f8;
      --orange:#f97316; --orange-dk:#c85a08;
      --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-400:#94a3b8; --gray-600:#475569; --gray-800:#1e293b;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--gray-100);color:var(--gray-800);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif}
    header{background:var(--blue)}
    .hdr{max-width:600px;margin:0 auto;padding:16px;display:flex;align-items:center;gap:10px}
    .icon{width:36px;height:36px;border-radius:8px;background:var(--orange);display:flex;align-items:center;justify-content:center}
    .ttl{font-weight:900;font-size:20px;color:#fff}
    .ttl span{color:var(--orange)}
    .sbar{background:#fff;border-bottom:2px solid var(--blue-bdr);display:flex}
    .sbtn{flex:1;min-width:64px;padding:10px 2px 8px;border:none;background:none;color:var(--gray-400);font-size:11px}
    .sbtn.active{color:var(--blue);border-bottom:3px solid var(--orange)}
    .num{display:block;font-size:16px;font-weight:900}
    main{max-width:600px;margin:0 auto;padding:16px 12px 80px}
    .ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .phb{width:4px;height:24px;background:var(--orange);border-radius:2px}
    .pht{font-size:18px;font-weight:900;color:var(--blue-dark)}
    .card{background:#fff;border:1.5px solid var(--blue-bdr);border-radius:10px;padding:16px;margin-bottom:12px}
    .ct{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--blue);text-transform:uppercase;border-bottom:1.5px solid var(--blue-light);padding-bottom:8px;margin-bottom:12px}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:12px;font-weight:700;color:var(--gray-600);margin-bottom:5px}
    .field input{width:100%;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:8px;background:var(--gray-50);font-size:14px}
    .fh{font-size:11px;color:var(--gray-400);margin-top:6px}
    .btn{width:100%;padding:13px;border:none;border-radius:8px;font-size:14px;font-weight:700;margin-top:8px}
    .btn-p{background:var(--orange);color:#fff}
    .btn-o{background:#fff;color:var(--gray-600);border:1.5px solid var(--gray-200)}
  </style>
</head>
<body>
  <header>
    <div class="hdr">
      <div class="icon">📊</div>
      <div class="ttl">LifePlan <span>AI</span></div>
    </div>
  </header>

  <div class="sbar">
    <button class="sbtn"><span class="num">01</span>基本情報</button>
    <button class="sbtn active"><span class="num">02</span>収支設定</button>
    <button class="sbtn"><span class="num">03</span>イベント</button>
    <button class="sbtn"><span class="num">04</span>グラフ</button>
    <button class="sbtn"><span class="num">05</span>AI診断</button>
  </div>

  <main>
    <div class="ph"><div class="phb"></div><div class="pht">毎月の収支（プレビュー）</div></div>

    <div class="card">
      <div class="ct">固定支出（月額・万円）</div>
      <div class="frow">
        <div class="field"><label>家賃</label><input value="25.04"></div>
        <div class="field"><label>保育料</label><input value="9.00"></div>
      </div>
      <div class="frow">
        <div class="field"><label>保険（アクサ）</label><input value="2.50"></div>
        <div class="field"><label>電気代（平均）</label><input value="2.50"></div>
      </div>
      <div class="frow">
        <div class="field"><label>奨学金返済</label><input value="2.00"></div>
        <div class="field"><label>サブスク各種</label><input value="1.40"></div>
      </div>
      <div class="frow">
        <div class="field"><label>携帯（SB+DF）</label><input value="1.08"></div>
        <div class="field"><label>ジム（AF+FEELCYCLE）</label><input value="1.00"></div>
      </div>
      <div class="frow">
        <div class="field"><label>ガス代（平均）</label><input value="1.00"></div>
        <div class="field"><label>アメックス年会費（月割）</label><input value="0.675"></div>
      </div>
      <div class="field"><label>ウォーターサーバー</label><input value="0.319"></div>
    </div>

    <div class="card">
      <div class="ct">変動支出（月平均・万円）</div>
      <div class="frow">
        <div class="field"><label>食費・昼食</label><input value="2.8"></div>
        <div class="field"><label>食費・外食</label><input value="0.8"></div>
      </div>
      <div class="frow">
        <div class="field"><label>食費・食料品</label><input value="1.3"></div>
        <div class="field"><label>UberEats</label><input value="0.6"></div>
      </div>
      <div class="frow">
        <div class="field"><label>交通費</label><input value="1.5"></div>
        <div class="field"><label>日用品</label><input value="0.6"></div>
      </div>
      <div class="field"><label>娯楽・趣味</label><input value="1.0"></div>
    </div>

    <div class="card">
      <div class="ct">特別支出（月平均・万円）</div>
      <div class="field"><label>特別支出（服・旅行・家電・交際費など）</label><input value="27.4"></div>
      <div class="fh">通常運転時の目安は 11.0 万円</div>
    </div>

    <button class="btn btn-p">次へ：ライフイベント →</button>
    <button class="btn btn-o">← 戻る</button>
  </main>
</body>
</html>
