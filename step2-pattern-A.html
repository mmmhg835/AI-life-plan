<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern A - 常時入力</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f1f5f9;margin:0}
    .wrap{max-width:640px;margin:0 auto;padding:16px}
    .card{background:#fff;border:1px solid #c2d3f8;border-radius:10px;padding:14px;margin-bottom:12px}
    .ttl{font-size:12px;font-weight:700;color:#1a56db;margin-bottom:10px}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .field{margin-bottom:10px}
    label{display:block;font-size:12px;color:#475569;margin-bottom:4px}
    input{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc}
    .hint{font-size:11px;color:#94a3b8}
    .badge{display:inline-block;background:#eef3fd;color:#1240a8;padding:4px 8px;border-radius:999px;font-size:11px;margin-bottom:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Pattern A: 常時入力 + 0でOFF扱い（おすすめ）</div>
    <div class="card">
      <div class="ttl">その他固定費（トグルなし）</div>
      <div class="frow">
        <div class="field"><label>駐車場代（万円）</label><input value="0"></div>
        <div class="field"><label>ジム・フィットネス（万円）</label><input value="0"></div>
      </div>
      <div class="frow">
        <div class="field"><label>習い事・学習（万円）</label><input value="0"></div>
        <div class="field"><label>タバコ（万円）</label><input value="0"></div>
      </div>
      <div class="frow">
        <div class="field"><label>ペット関連（万円）</label><input value="0"></div>
        <div class="field"><label>仕送り・親への支援（万円）</label><input value="0"></div>
      </div>
      <div class="frow">
        <div class="field"><label>ゴルフ・スポーツ（万円）</label><input value="0"></div>
        <div class="field"><label>美容・サロン（万円）</label><input value="0"></div>
      </div>
      <div class="hint">使わない項目は 0 のままでOK。トグル操作は不要。</div>
    </div>
  </div>
</body>
</html>
