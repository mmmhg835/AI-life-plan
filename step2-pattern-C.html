<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern C - 折りたたみ</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f1f5f9;margin:0}
    .wrap{max-width:640px;margin:0 auto;padding:16px}
    .card{background:#fff;border:1px solid #c2d3f8;border-radius:10px;padding:14px}
    .ttl{font-size:12px;font-weight:700;color:#1a56db;margin-bottom:10px}
    .field{margin-bottom:10px}
    label{display:block;font-size:12px;color:#475569;margin-bottom:4px}
    input{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc}
    details{border:1px dashed #c2d3f8;border-radius:8px;padding:10px;margin-top:8px}
    summary{cursor:pointer;font-weight:600;color:#1240a8}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    .badge{display:inline-block;background:#eef3fd;color:#1240a8;padding:4px 8px;border-radius:999px;font-size:11px;margin-bottom:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Pattern C: 主要項目のみ表示 + 詳細は開く</div>
    <div class="card">
      <div class="ttl">固定支出（主要項目）</div>
      <div class="frow">
        <div class="field"><label>住居費</label><input value="25"></div>
        <div class="field"><label>食費</label><input value="4"></div>
      </div>
      <div class="frow">
        <div class="field"><label>光熱費</label><input value="4"></div>
        <div class="field"><label>通信費</label><input value="1.5"></div>
      </div>
      <details open>
        <summary>その他固定費を開く</summary>
        <div class="frow">
          <div class="field"><label>駐車場代</label><input value="0"></div>
          <div class="field"><label>ジム・フィットネス</label><input value="0"></div>
        </div>
        <div class="frow">
          <div class="field"><label>習い事・学習</label><input value="0"></div>
          <div class="field"><label>美容・サロン</label><input value="0"></div>
        </div>
      </details>
    </div>
  </div>
</body>
</html>
